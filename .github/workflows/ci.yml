name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust ──
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tva-core

  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tva-core --lib -- -D warnings

  test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tva-core --lib
      - run: cargo test -p tva-core --doc

      - name: Generate fixtures
        run: bash scripts/gen_fixtures.sh

      - name: Integration test with fixtures
        run: cargo test -p tva-core --test integration --features decode-images -- --nocapture

      - name: Download test video
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl -L -o /tmp/test.mp4 "https://samplelib.com/lib/preview/mp4/sample-5s.mp4"
          mkdir -p /tmp/test_frames
          ffmpeg -i /tmp/test.mp4 -vf "fps=10,scale=320:-1" -frames:v 30 /tmp/test_frames/%04d.png -y

      - name: CLI smoke test (frames)
        run: cargo run -p tva-cli -- analyze /tmp/test_frames --format json | head -5

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  targets:
    name: Targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tva-ffi
      - run: cargo check -p tva-cli
      - run: cargo check -p tva-core --features compare-image,smooth-savgol,fft

  # ── MegaLinter: YAML, Markdown, JSON, TOML, Dockerfile, Secrets ──
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/rust@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          DEFAULT_BRANCH: main
          REPORT_OUTPUT_FOLDER: none
