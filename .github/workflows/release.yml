name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── Build binaries for all platforms ──
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p tva-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/tva-cli${{ matrix.ext }}"
          ARCHIVE="tva-cli-${{ matrix.target }}${{ matrix.ext }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${ARCHIVE}.zip" "$BIN"
          else
            tar czf "tva-cli-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tva-cli-${{ matrix.target }}
          path: tva-cli-${{ matrix.target }}.*

  # ── GitHub Release ──
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: tva-cli-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tva-cli-*.tar.gz
            tva-cli-*.zip
          generate_release_notes: true
