[package]
name = "tva-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TVA Contributors"]
description = "CLI for Temporal Video Analyzer — analyze FPS, duplicates, tears"
homepage = "https://github.com/tayuLuc/tva"
repository = "https://github.com/tayuLuc/tva"
keywords = ["video", "analysis", "cli", "fps"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
tva-core = { path = "../tva-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
csv = "1"
