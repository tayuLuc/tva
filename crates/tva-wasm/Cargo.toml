[package]
name = "tva-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TVA Contributors"]
description = "WASM bindings for tva-core"
homepage = "https://github.com/YOUR_USER/tva"
repository = "https://github.com/YOUR_USER/tva"
keywords = ["video", "analysis", "wasm"]
categories = ["wasm", "multimedia::video"]

[dependencies]
tva-core = { path = "../tva-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
