[package]
name = "tva-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for tva-core"

[dependencies]
tva-core = { path = "../tva-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
