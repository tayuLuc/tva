[package]
name = "tva-core"
version = "0.1.0"
edition = "2021"
description = "Core video analysis engine for Temporal Video Analyzer"

[dependencies]
image = "0.25"
image-compare = "0.5"
palette = "0.7"
staged-sg-filter = "0.2"
rustfft = "6.2"
dssim-core = { version = "3.4", optional = true }
video-rs = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"

[features]
default = []
decode = ["dep:video-rs"]
multicore-ssim = ["dep:dssim-core"]

[dev-dependencies]
approx = "0.5"

[lib]
name = "tva_core"
path = "src/lib.rs"
