[package]
name = "tva-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["TVA Contributors"]
description = "Core video analysis engine — FPS, duplicates, tears, frametime metrics"
homepage = "https://github.com/tayuLuc/tva"
repository = "https://github.com/tayuLuc/tva"
keywords = ["video", "analysis", "fps", "duplicate", "tear"]
categories = ["multimedia::video"]

[lib]
name = "tva_core"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

image = { version = "0.25", optional = true }
image-compare = { version = "0.5", optional = true }
rgb = "0.8"
dssim-core = { version = "3.4", optional = true }
savgol-rs = { version = "0.1", optional = true }
rustfft = { version = "6.2", optional = true }
video-rs = { version = "0.10", optional = true }
ffmpeg-next = { version = "8.1.0", features = ["build"], optional = true }

[lints.clippy]
module_name_repetitions = "allow"
needless_borrows_for_generic_args = "allow"
needless_range_loop = "allow"

[features]
default = []
compare-image = ["dep:image", "dep:image-compare"]
compare-dssim = ["dep:image", "dep:dssim-core"]
smooth-savgol = ["dep:savgol-rs"]
decode-ffmpeg = ["dep:video-rs"]
decode-ffmpeg-native = ["dep:ffmpeg-next"]
decode-images = ["dep:image"]
fft = ["dep:rustfft"]
