[package]
name = "tva-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["TVA Contributors"]
description = "Core video analysis engine — FPS, duplicates, tears, frametime metrics"
homepage = "https://github.com/YOUR_USER/tva"
repository = "https://github.com/YOUR_USER/tva"
keywords = ["video", "analysis", "fps", "duplicate", "tear"]
categories = ["multimedia::video", "science::robotics"]

[lib]
name = "tva_core"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

image = { version = "0.25", optional = true }
image-compare = { version = "0.5", optional = true }
dssim-core = { version = "3.4", optional = true }
staged-sg-filter = { version = "0.2", optional = true }
rustfft = { version = "6.2", optional = true }
video-rs = { version = "0.10", optional = true }

[features]
default = []
compare-image = ["dep:image", "dep:image-compare"]
compare-dssim = ["dep:image", "dep:dssim-core"]
smooth-savgol = ["dep:staged-sg-filter"]
decode-ffmpeg = ["dep:video-rs"]
fft = ["dep:rustfft"]
