[package]
name = "tva-core"
version = "0.1.0"
edition = "2021"
description = "Core video analysis engine for Temporal Video Analyzer"

[dependencies]
ffmpeg-next = "7"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rayon = "1"
palette = "0.7"
dssim-core = "3.4"
rgb = "0.8"
bytemuck = { version = "1", features = ["derive"] }
savgol-rs = "0.1"
rustfft = "6.2"
thiserror = "2"

[dev-dependencies]
approx = "0.5"

[lib]
name = "tva_core"
path = "src/lib.rs"
