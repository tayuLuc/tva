[advisories]
ignore = [
    "paste",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "WTFPL",
    "NCSA",
]
exceptions = [
    { allow = ["AGPL-3.0"], crate = "dssim-core" },
]

[bans]
multiple-versions = "warn"
